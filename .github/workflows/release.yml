name: Release Android APK & Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag da release (ex: v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json
      - name: Install Frontend Dependencies
        working-directory: ./front
        run: npm ci || npm install
      - name: Build Android APK
        working-directory: ./front
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then npx tauri android init; fi
          if [ -f "src-tauri/gen/android/gradlew" ]; then chmod +x src-tauri/gen/android/gradlew; fi
          npx tauri android build --apk
      - name: Sign Android APK
        working-directory: ./front
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'arestaReader2026KeyPass' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'aresta-reader' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'arestaReader2026KeyPass' }}
        run: |
          KEYSTORE_FILE="src-tauri/release.keystore"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "Erro: Keystore $KEYSTORE_FILE não encontrada em $(pwd)"
            exit 1
          fi

          echo "Utilizando Keystore JKS: $KEYSTORE_FILE"

          # Encontra e assina recursivamente todos os APKs gerados
          find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" ! -name "*-signed.apk" | while read -r apk; do
            echo "Encontrado APK para assinar: $apk"
            dir=$(dirname "$apk")
            base=$(basename "$apk" .apk)
            clean_base=$(echo "$base" | sed 's/-unsigned$//')
            signed_apk="$dir/${clean_base}-signed.apk"

            echo "Assinando via apksigner -> $signed_apk"
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
              --ks "$KEYSTORE_FILE" \
              --ks-type JKS \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --out "$signed_apk" \
              "$apk"

            echo "Validando integridade da assinatura:"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "$signed_apk"

            # Remove o APK não assinado para que apenas o assinado seja publicado
            rm -f "$apk"
          done
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          name: Aresta Reader ${{ github.ref_name || github.event.inputs.tag_name }}
          files: front/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json
      - name: Install Frontend Dependencies
        working-directory: ./front
        run: npm ci || npm install
      - name: Build Desktop
        working-directory: ./front
        run: npx tauri build
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          files: front/src-tauri/target/release/bundle/**/*
