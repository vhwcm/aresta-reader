<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="100%" height="100%">
  <defs>
    <!-- Gradiente Laranja Aresta para as arestas -->
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF956D" />
      <stop offset="100%" stop-color="#E57B55" />
    </linearGradient>
    <!-- Brilho sutil para os nós da marca -->
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo 100% Branco Puro para aba do navegador -->
  <rect width="40" height="40" rx="9" fill="#FFFFFF" />

  <!-- Arestas (Linhas que formam a letra A em grafo vivo - Laranja Aresta) -->
  <g stroke="url(#edgeGrad)" stroke-width="2.2" stroke-linecap="round">
    <!-- Haste esquerda -->
    <line x1="20" y1="7.5" x2="12" y2="23" />
    <line x1="12" y1="23" x2="7" y2="33" />
    <!-- Haste direita -->
    <line x1="20" y1="7.5" x2="28" y2="23" />
    <line x1="28" y1="23" x2="33" y2="33" />
    <!-- Travessão central -->
    <line x1="12" y1="23" x2="28" y2="23" stroke="#E57B55" stroke-width="2.2" />
    <!-- Conexão sutil vertical -->
    <line x1="20" y1="7.5" x2="20" y2="23" stroke="#E57B55" stroke-opacity="0.4" stroke-dasharray="2 2" stroke-width="1.2" />
  </g>

  <!-- Vértices / Nós do Grafo (Laranja Vibrante sobre Fundo Branco) -->
  <g filter="url(#nodeGlow)">
    <!-- Topo -->
    <g>
      <circle cx="20" cy="7.5" r="3.4" fill="#FFFFFF" stroke="#E57B55" stroke-width="1.8" />
      <circle cx="20" cy="7.5" r="1.4" fill="#E57B55" />
    </g>
    <!-- Meio Esquerda -->
    <g>
      <circle cx="12" cy="23" r="3" fill="#FFFFFF" stroke="#E57B55" stroke-width="1.6" />
      <circle cx="12" cy="23" r="1.2" fill="#E57B55" />
    </g>
    <!-- Meio Direita -->
    <g>
      <circle cx="28" cy="23" r="3" fill="#FFFFFF" stroke="#E57B55" stroke-width="1.6" />
      <circle cx="28" cy="23" r="1.2" fill="#E57B55" />
    </g>
    <!-- Base Esquerda -->
    <g>
      <circle cx="7" cy="33" r="2.7" fill="#FFFFFF" stroke="#E57B55" stroke-width="1.5" />
      <circle cx="7" cy="33" r="1" fill="#E57B55" />
    </g>
    <!-- Base Direita -->
    <g>
      <circle cx="33" cy="33" r="2.7" fill="#FFFFFF" stroke="#E57B55" stroke-width="1.5" />
      <circle cx="33" cy="33" r="1" fill="#E57B55" />
    </g>
    <!-- Centro do travessão -->
    <circle cx="20" cy="23" r="1.8" fill="#E57B55" />
  </g>
</svg>